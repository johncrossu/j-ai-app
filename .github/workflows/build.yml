name: Build J-AI APK v3.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Write build files
        run: |
          cat > build.gradle << 'GRADLE'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath "com.android.tools.build:gradle:8.1.4" }
}
allprojects { repositories { google(); mavenCentral() } }
GRADLE
          cat > settings.gradle << 'GRADLE'
include ':app'
rootProject.name = 'J-AI'
GRADLE
          cat > gradle.properties << 'GRADLE'
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=34
GRADLE
          cat > app/build.gradle << 'GRADLE'
apply plugin: 'com.android.application'
android {
    namespace 'com.johncross.jai'
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.johncross.jai"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 300
        versionName "3.0"
    }
    buildTypes {
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
GRADLE

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: J-AI-v3.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show result
        run: find . -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "No APK found"
