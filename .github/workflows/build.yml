name: Build J-AI WebView APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses 2>/dev/null || true
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
      - run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: J-AI-WebView-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
