name: Build J-AI APK v3.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0" 2>/dev/null || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Create root build.gradle
        run: printf 'buildscript {\n  repositories { google(); mavenCentral() }\n  dependencies { classpath "com.android.tools.build:gradle:8.1.4" }\n}\nallprojects { repositories { google(); mavenCentral() } }\n' > build.gradle

      - name: Create settings.gradle
        run: printf 'include ":app"\nrootProject.name = "J-AI"\n' > settings.gradle

      - name: Create app build.gradle
        run: |
          printf 'apply plugin: "com.android.application"\nandroid {\n  namespace "com.johncross.jai"\n  compileSdkVersion 35\n  defaultConfig {\n    applicationId "com.johncross.jai"\n    minSdkVersion 21\n    targetSdkVersion 35\n    versionCode 300\n    versionName "3.0"\n  }\n  buildTypes {\n    debug { minifyEnabled false }\n  }\n  compileOptions {\n    sourceCompatibility JavaVersion.VERSION_1_8\n    targetCompatibility JavaVersion.VERSION_1_8\n  }\n}\ndependencies {\n  implementation "androidx.appcompat:appcompat:1.6.1"\n  implementation "androidx.webkit:webkit:1.8.0"\n  implementation "androidx.core:core:1.12.0"\n}\n' > app/build.gradle

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: J-AI-v3.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show result
        run: find . -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "No APK found"
