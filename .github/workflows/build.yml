name: Build J-AI WebView APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install build tools
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" 2>/dev/null || true

      - name: Install Gradle 8.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip -d /opt/gradle
          export PATH=/opt/gradle/gradle-8.0/bin:$PATH
          echo "PATH=/opt/gradle/gradle-8.0/bin:$PATH" >> $GITHUB_ENV
          gradle --version

      - name: Build APK
        run: |
          export PATH=/opt/gradle/gradle-8.0/bin:$PATH
          gradle assembleDebug --project-dir . --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: J-AI-WebView-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Show result
        run: find . -name "*.apk" 2>/dev/null || echo "No APK found"
